<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API · GestioRubyCristancho</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #be185d;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .login {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      max-width: 760px;
    }
    .login label {
      display: grid;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .login input {
      width: 220px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }
    .login button {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .login button:disabled { opacity: .6; cursor: wait; }
    #login-status {
      min-height: 1.2em;
      font-size: 0.8rem;
      color: var(--muted);
      flex-basis: 100%;
    }
    #swagger-ui { max-width: 1280px; margin: 0 auto; padding: 0 18px 40px; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>GestioRubyCristancho · API</h1>
    <p>Documentación interactiva (Swagger UI). La API usa sesión Sanctum: inicia sesión aquí y prueba los endpoints con “Try it out”.</p>
    <form class="login" id="login-form">
      <label>
        Correo
        <input id="email" type="email" autocomplete="username" value="admin@rubycristancho.local" required>
      </label>
      <label>
        Contraseña
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="login-button">Iniciar sesión</button>
      <span id="login-status">Sin sesión iniciada.</span>
    </form>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    function csrfToken() {
      const match = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    async function login(event) {
      event.preventDefault();
      const boton = document.getElementById('login-button');
      const estado = document.getElementById('login-status');
      boton.disabled = true;
      estado.textContent = 'Iniciando sesión…';

      try {
        await fetch('/sanctum/csrf-cookie', { credentials: 'include' });

        const respuesta = await fetch('/api/login', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'X-XSRF-TOKEN': csrfToken(),
          },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });

        const datos = await respuesta.json().catch(() => ({}));

        if (!respuesta.ok) {
          estado.textContent = datos.message || 'No se pudo iniciar sesión.';
          return;
        }

        estado.textContent = 'Sesión iniciada: ' + (datos.user?.email || 'ok');
      } catch (error) {
        estado.textContent = 'Error de conexión con la API.';
      } finally {
        boton.disabled = false;
      }
    }

    document.getElementById('login-form').addEventListener('submit', login);

    window.addEventListener('load', () => {
      window.ui = SwaggerUIBundle({
        url: '/docs/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        withCredentials: true,
        persistAuthorization: true,
        requestInterceptor: (request) => {
          request.credentials = 'include';
          const token = csrfToken();
          if (token) {
            request.headers['X-XSRF-TOKEN'] = token;
          }
          return request;
        },
      });
    });
  </script>
</body>
</html>
